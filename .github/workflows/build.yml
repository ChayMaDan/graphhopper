name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      #Build et Test
      - name: Build and Test ${{ matrix.java-version }}
        run: mvn -B clean install -DskipTests
      
      # Run tests
      - name: Run Tests
        if: success()
        run: mvn -B test
      
      # PIT Mutation Testing (core module only - specific classes)
      - name: Run PIT Mutation Testing (core)
        if: success()
        run: |
          mvn -B -pl core \
            -DtargetClasses=com.graphhopper.routing.util.RoadDensityCalculator,com.graphhopper.routing.weighting.QueryGraphWeighting \
            -DtargetTests=com.graphhopper.routing.util.RoadDensityCalculatorTest,com.graphhopper.routing.weighting.QueryGraphWeightingTest \
            org.pitest:pitest-maven:mutationCoverage
      
      # Check PIT mutation score
      - name: Check Mutation Score
        if: success()
        run: |
          # Extract mutation score from PIT report
          MUTATION_SCORE=$(grep -oP '(?<=<td>)[0-9]+(?=%</td>)' core/target/pit-reports/*/index.html | head -1)
          echo "Current Mutation Score: ${MUTATION_SCORE}%"
          
          # Define minimum acceptable mutation score
          MIN_SCORE=50
          
          if [ "$MUTATION_SCORE" -lt "$MIN_SCORE" ]; then
            echo "::error title=Mutation Score Too Low::Mutation score ($MUTATION_SCORE%) is below minimum threshold ($MIN_SCORE%)"
            exit 1
          fi
          
          echo "✓ Mutation score ($MUTATION_SCORE%) meets minimum threshold ($MIN_SCORE%)"
      
      # Upload PIT report as artifact
      - name: Upload PIT Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report-java-${{ matrix.java-version }}
          path: core/target/pit-reports
      
      #Rickroll
      - name: Rickroll
        if: failure()
        run: |
          echo ""
          echo "######################################################"
          echo ""
          echo ""
          echo "                           ************"
          echo "                           *********"
          echo "                           ************"
          echo "                           *********"
          echo "                           *"
          echo "                           *"
          echo "                           *"
          echo "                         * * *"
          echo "                        ** * **"
          echo "                      **** * ****"
          echo "                    ****** * ******"
          echo "                  ******** * ********"
          echo "                ********** * **********"
          echo "              ************ * ************"
          echo "            ************** * **************"
          echo "  *************************************************"
          echo "      *****************************************"
          echo "          *********************************"
          echo "            *****************************"
          echo "                *********************"
          echo "###################################################"
          echo "###################################################"
          echo ""
          echo ""
          echo "    OHÉ!! OHÉ!! MATELOT !! Matelot navigue sur les flots..."
          echo ""
          echo "                Vos tests ont échoué !  :-("
          echo "         Corrigez votre code avant de vous noyer !!!!! "
          echo ""

          echo "::error title= Rickroll Test Failure:: Vos tests ont échoué!"
          echo "::warning title= Meme::https://blog.zegocloud.com/wp-content/uploads/2024/02/programming-meme-22.jpg"
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ![MEME](https://blog.zegocloud.com/wp-content/uploads/2024/02/programming-meme-22.jpg)

          Un ou plusieurs tests ont échoué ! Corrigez votre code. 
          EOF
